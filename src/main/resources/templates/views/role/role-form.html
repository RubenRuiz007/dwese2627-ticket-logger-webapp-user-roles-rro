<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head ('Ticket Logger - Roles')}"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- Contenido dinámico -->
<main class="form-page">
    <div class="form-card">

        <!-- Título dinámico (add/edit) -->
        <h1 th:text="${role.id == null} ? #{msg.role-form.add} : #{msg.role-form.edit}"></h1>

        <!-- Mensaje de error global -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Formulario: solo datos del rol, sin ninguna asignación de usuarios -->
        <form th:action="${role.id == null} ? @{/roles/insert} : @{/roles/update}"
              th:object="${role}" method="post" class="mt-3">

            <input type="hidden" th:field="*{id}"/>

            <!-- Nombre -->
            <div class="mb-3">
                <label for="name" class="form-label" th:text="#{msg.role-form.name}"></label>
                <input type="text" id="name" th:field="*{name}" class="form-control"/>
                <div th:if="${#fields.hasErrors('name')}" class="text-danger" th:errors="*{name}"></div>
            </div>

            <!-- Botón submit dinámico -->
            <button type="submit" class="btn btn-primary"
                    th:text="${role.id == null} ? #{msg.role-form.create} : #{msg.role-form.update}"></button>

            <!-- Volver al listado -->
            <a th:href="@{/roles}" class="btn btn-secondary" th:text="#{msg.role-form.returnback}"></a>

        </form>

    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
