<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head ('Ticket Logger - Usuarios')}"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- Contenido dinámico -->
<main class="form-page">
    <div class="form-card">

        <h1 th:text="#{msg.user-detail.title}"></h1>

        <dl class="row mt-3">
            <dt class="col-sm-4" th:text="#{msg.user-list.id}"></dt>
            <dd class="col-sm-8" th:text="${user.id}"></dd>

            <dt class="col-sm-4" th:text="#{msg.user-form.username}"></dt>
            <dd class="col-sm-8" th:text="${user.username}"></dd>

            <dt class="col-sm-4" th:text="#{msg.user-form.email}"></dt>
            <dd class="col-sm-8" th:text="${user.email}"></dd>

            <dt class="col-sm-4" th:text="#{msg.user-form.fullName}"></dt>
            <dd class="col-sm-8" th:text="${user.fullName}"></dd>

            <dt class="col-sm-4" th:text="#{msg.user-form.roles}"></dt>
            <dd class="col-sm-8">
                <span th:each="role : ${user.roles}" class="badge bg-primary me-1" th:text="${role.name}"></span>
                <span th:if="${#lists.isEmpty(user.roles)}" class="text-muted" th:text="#{msg.user-detail.noRoles}"></span>
            </dd>
        </dl>

        <a th:href="@{/users/edit(id=${user.id})}" class="btn btn-primary" th:text="#{msg.user-list.edit}"></a>
        <a th:href="@{/users}" class="btn btn-secondary" th:text="#{msg.user-form.returnback}"></a>

    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
