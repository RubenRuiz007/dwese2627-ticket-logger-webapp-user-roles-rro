<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head ('Ticket Logger - Usuarios')}"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="~{fragments/header :: header}"></header>

<!-- Contenido dinámico -->
<main class="list-page">
    <div class="list-card" style="max-width: 1100px;">

        <h1 th:text="#{msg.user-list.title}"></h1>

        <a th:href="@{/users/new}" class="btn btn-success" th:text="#{msg.user-list.add}"></a>

        <!-- Mensaje de error -->
        <div th:if="${errorMessage}" class="alert alert-danger mt-3" th:text="${errorMessage}"></div>

        <table class="table table-bordered table-striped mt-3">
            <thead>
            <tr>
                <th th:text="#{msg.user-list.id}"></th>
                <th th:text="#{msg.user-list.username}"></th>
                <th th:text="#{msg.user-list.email}"></th>
                <th th:text="#{msg.user-list.fullName}"></th>
                <th th:text="#{msg.user-list.roles}"></th>
                <th th:text="#{msg.user-list.actions}"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${listUsers}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.fullName}"></td>
                <!-- Un badge por cada rol del usuario -->
                <td>
                    <span th:each="role : ${user.roles}" class="badge bg-primary me-1" th:text="${role.name}"></span>
                </td>
                <td class="text-nowrap">
                    <div class="d-flex justify-content-center gap-2">
                        <!-- Detalle -->
                        <a th:href="@{/users/detail(id=${user.id})}" class="btn btn-info btn-sm"
                           th:text="#{msg.user-list.detail}"></a>

                        <!-- Editar -->
                        <a th:href="@{/users/edit(id=${user.id})}" class="btn btn-primary btn-sm"
                           th:text="#{msg.user-list.edit}"></a>

                        <!-- Eliminar -->
                        <form th:action="@{/users/delete}" method="post" class="m-0">
                            <input type="hidden" name="id" th:value="${user.id}"/>
                            <button type="submit" class="btn btn-danger btn-sm"
                                    th:text="#{msg.user-list.delete}"
                                    th:onclick="|return confirm('#{msg.user-list.confirm}');|"></button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <a th:href="@{/}" class="btn btn-secondary" th:text="#{msg.user-form.returnback}"></a>

    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<div th:replace="~{fragments/scripts :: scripts}"></div>

</body>
</html>
